<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booky se mudó a escobar.sv</title>
<link rel="canonical" href="https://escobar.sv/booky/">
<meta http-equiv="refresh" content="0; url=https://escobar.sv/booky/">
<meta name="robots" content="noindex">
<script>
  // Las anclas viejas (#en, #beta-en, #soporte…) llevan a su sitio en escobar.sv.
  (function () {
    var h = location.hash;
    var en = h === "#en" || h === "#beta-en";
    var url = en ? "https://escobar.sv/en/booky/" : "https://escobar.sv/booky/";
    if (h === "#soporte") url += "#soporte";
    location.replace(url);
  })();
</script>
<style>
  body { margin: 0; background: #0A0B0E; color: #F2F3F5; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 20px; }
  a { color: #F2F3F5; }
</style>
</head>
<body>
<main>
  <p>Booky ahora está en <a href="https://escobar.sv/booky/">escobar.sv/booky</a>.</p>
  <p lang="en">Booky has moved to <a href="https://escobar.sv/en/booky/">escobar.sv/en/booky</a>.</p>
</main>
</body>
</html>
